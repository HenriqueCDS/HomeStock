version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stockflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: stockflow:${APP_VERSION:-latest}
    container_name: stockflow-app-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXP_MS: ${JWT_ACCESS_EXP_MS:-900000}
      JWT_REFRESH_EXP_MS: ${JWT_REFRESH_EXP_MS:-604800000}
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseContainerSupport"
    ports:
      - "8080:8080"
    networks:
      - stockflow-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  stockflow-net:
    driver: bridge

volumes:
  postgres_data:
